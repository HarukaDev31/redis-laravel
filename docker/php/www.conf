[www]
; Los contenedores corren con network_mode: host, así que php-fpm escucha solo en localhost
; y en un puerto propio para no chocar con los php-fpm 7.4 que ya hay en el servidor.
listen = 127.0.0.1:${FPM_PORT}
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
clear_env = no
