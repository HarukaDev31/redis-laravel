name: Deploy PROD

# La imagen se construye aquí y se sube a GHCR; el servidor solo hace pull + up (no compila nada).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "deploy" para confirmar (solo deploy manual)'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/harukadev31/redis-laravel

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'deploy'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.IMAGE }}:app-${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Smoke check (PHP 8.5 + rutas)
        run: |
          docker run --rm "${IMAGE}:app-${GITHUB_SHA}" php -v
          docker run --rm -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "${IMAGE}:app-${GITHUB_SHA}" php artisan route:list --path=api/whatsapp

      - name: Push app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE }}:app-${{ github.sha }}
            ${{ env.IMAGE }}:app-latest
          cache-from: type=gha,scope=app

      - name: Build y push web (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE }}:web-${{ github.sha }}
            ${{ env.IMAGE }}:web-latest
          cache-from: |
            type=gha,scope=app
            type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.REDIS_LARAVEL_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/var/www/html/redis-laravel"; fi

            sudo git config --global --add safe.directory "${DEPLOY_PATH}" || true
            cd "${DEPLOY_PATH}"
            sudo git fetch origin main
            sudo git checkout main
            sudo git merge --ff-only origin/main

            IMAGE_TAG="${{ github.sha }}"
            DC="sudo env IMAGE_TAG=${IMAGE_TAG} docker compose"
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            ${DC} pull app web
            sudo docker logout ghcr.io || true

            # Mismas imágenes como :latest para que un "docker compose up -d" manual no las vuelva a bajar/compilar
            sudo docker tag "ghcr.io/harukadev31/redis-laravel:app-${IMAGE_TAG}" ghcr.io/harukadev31/redis-laravel:app-latest
            sudo docker tag "ghcr.io/harukadev31/redis-laravel:web-${IMAGE_TAG}" ghcr.io/harukadev31/redis-laravel:web-latest

            ${DC} up -d --no-build --remove-orphans
            ${DC} ps
            sudo docker image prune -f >/dev/null || true
